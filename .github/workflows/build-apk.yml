name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android files banao
        run: flutter create --platforms=android --org com.aprime --project-name aprime_mobile .
      - name: main.dart sahi jagah rakho
        run: |
          if [ -f main.dart ]; then mkdir -p lib && mv main.dart lib/main.dart; fi
      - name: App ka naam
        run: sed -i 's/android:label="[^"]*"/android:label="Aprime"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: aprime-apk
          path: build/app/outputs/flutter-apk/app-release.apk
